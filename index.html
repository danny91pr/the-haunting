<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>The Haunting</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>ASYMMETRIC MULTIPLAYER HORROR</small><h1>THE HAUNTING</h1><p>One entity. Up to four investigators. One mansion.</p></header><section id="lobby" class="card"><input id="name" placeholder="Your name" maxlength="18" value="Player"><div class="flex"><button id="create">Create room</button><input id="code" placeholder="ROOM CODE" maxlength="6"><button id="join">Join room</button></div><p>Share the room code and the public game URL with your friends.</p></section><section id="game" hidden><div class="flex"><strong id="roomcode"></strong><span id="phase"></span><button id="start" hidden>Start match</button></div><div class="layout"><div><div class="card"><canvas id="map" width="720" height="560"></canvas><p id="help"></p></div><div class="card" id="controls"></div></div><aside><div class="card" id="stats"></div><div class="card"><h3>PLAYERS</h3><div id="roster"></div></div><div class="card"><h3>EVENTS</h3><div id="events"></div></div></aside></div></section><div id="toast"></div><footer>Prototype · Browser multiplayer · Temporary rooms · Server must remain running</footer></main><script src="client.js"></script></body></html>
